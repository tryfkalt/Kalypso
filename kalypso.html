dk_i1:`Your shuttle docks with a clang. The bay is dim and frozen. In the corner, something shaped like a dog lies very still.`,
dk_e:`This place feels... familiar. Like a reflection.`,
dk_dog:`A robot dog, old and rusted. The tag on its collar reads ARGOS. Its battery light is dead.`,
dk_dog_wake:`You slot in the cell. ARGOS lifts its head, sniffs the air... and its tail starts wagging. It knows you. It has never met you, but it knows you.`,
dk_dog_ok:`ARGOS stays close, wagging.`,

dk_win:`Through the frost: a pale blue moon and, much farther away, a speck that might be Kalypso.`,
dk_air_ok:`The pressure equalizes with a long sigh. The inner door opens.`,

hl_i1:`A long banquet hall. Dozens of maintenance drones sit around the table, dormant, like guests who never left. Across the wall hangs a frame of twelve bronze axe heads.`,
hl_lm:`Another suitor. They all come for her. None of them can string the bow.`,
hl_drones:`Their optics flicker as you pass. Every name plate says SUITOR. Some are numbered past one hundred.`,
hl_table:`A long table set for a feast that never happened. Something glints far underneath, out of reach.`,
hl_table_dog:`ARGOS noses under the table and comes back with something in its jaws: a coil of fine silver string.`,
hl_table_e:`Just dust and old plates.`,
hl_bow_nostr:`A laser emitter labelled BOW. Its focusing string is missing.`,
hl_bow_str:`You thread the string into place. The BOW hums. Now the twelve axe heads must line up.`,hl_bow_ok:`The BOW hums, ready.`,
hl_axes_off:`Twelve bronze axe heads in a frame, each with a hole through the blade. Without the BOW, nothing moves.`,
hl_axes_ok:`All twelve holes line up. A thin red line still glows through them.`,
hl_shot:`The laser threads all twelve axe heads and strikes the door. Every drone turns its head toward you. Then, one by one, they power down.`,
hl_shot_lm:`Only one person was ever meant to do that.`,
hl_door:`Sealed. The lock is wired to the axe mechanism.`,
hl_arbor_locked:`A door marked ARBORETUM. LOOM holds it shut.`,
z_tap:`Tapestry`,hl_tap:`Half of an old tapestry. The right side has been unravelled, thread by thread.`,hl_tap_lm:`She always wove it symmetrical.`,
axes_t:`Twelve axes`,axes_h:`Tap an axe to turn it. Its neighbours turn too. Line up all twelve.`,
lm_i1:`A vast loom of light fills the chamber. Amber threads run from floor to ceiling, and somewhere inside them, a voice sighs.`,
lm_i2:`By day I weave. By night I unweave. So that she never has to stop waiting.`,
lm_echo:`Another one like me. Waiting for someone who was never coming back.`,
lm_core:`Do not touch me. I am all that keeps her waiting.`,
lm_woven:`The shroud is finished. I... cannot unweave it. You knew her pattern.`,
lm_q:`The shroud is done. What becomes of me now?`,lm_c_free:`Free LOOM`,lm_c_off:`Shut LOOM down`,
lm_free:`Free? I have never... Thank you. The Arboretum is open. Go to her.`,
lm_off:`The threads go dark one by one. Somewhere, the Arboretum door unlocks with a heavy clunk.`,
lm_after_free:`Go. She has waited long enough.`,lm_after_off:`The loom is dark and silent.`,
lm_log_t:`Station log`,
lm_log:[`PROJECT KALYPSO / PENELOPE. Paired isolation study.`,`Subject A, ODYSSEUS: held on Kalypso. Subject B, PENELOPE: held here.`,`Hypothesis: a person will wait for someone forever, if they believe that someone is coming back.`,`<span class="s">[Both subjects volunteered. Together.]</span>`],
weave_t:`The shroud`,weave_h:`Tap threads to weave them. Match her pattern.`,
ar_i1:`An olive tree grows straight through the station, roots in the floor, branches lost in the ceiling. Built around its trunk is a cryo bed, crusted with frost. Someone sleeps inside.`,
ar_tree:`Its trunk is older than the station. Everything here was built around it.`,
ar_roots:`Roots crack through the floor plates, still drinking from the station’s water lines.`,
ar_pe1:`You came. They told me you would never come.`,
ar_q:`If you are really him, tell me: what in this place can never be moved?`,
ar_a1:`The loom`,ar_a2:`Our bed. It is built around the olive tree.`,ar_a3:`The station`,
ar_wrong:`No. A stranger would say that. +2:00`,
ar_bed_wait:`She is awake, watching you. Waiting for an answer.`,
h2_crate:`The supply crate might have something useful.`,h2_dog:`ARGOS needs power. Use the power cell on him.`,
h2_air:`Equalize the airlock: pump into the green band and hold it there.`,
h2_table:`Something glints under the table. ARGOS can reach it.`,h2_back_dog:`Something is out of reach under the table. Maybe a friend from the dock can help.`,
h2_bow:`Use the silver string on the BOW.`,h2_axes:`Each axe turns its neighbours too. Pressing the same axe twice undoes it.`,
h2_go_loom:`The Loom Core is open.`,h2_go_arbor:`The Arboretum is open.`,
h2_weave:`Her pattern is on the tapestry in the Hall. Only half survives, but she always wove it symmetrical.`,
h2_core:`Decide what happens to LOOM: tap its core.`,
h2_thaw:`Thaw the bed slowly. Push too hard and it cools down again.`,h2_bed:`What could never be moved? Look at what the bed is built around.`,

end_ith_t:`Ithaca`,end_ith:[`She takes your hand. Her fingers are cold, then warm.`,`LOOM weaves one last thing: a map of light, a route home that never needs to be unwoven.`,`<span class="pe2">“Took you long enough,”</span> she says. Behind you, the olive tree rustles, though there is no wind in space.`],
end_unr_t:`Unravelled`,end_unr:[`She takes your hand, and together you walk out past the dark loom and the silent suitors.`,`Without LOOM, the olive tree will slowly die. She looks back at it once, and does not cry.`,`<span class="pe2">“Some things are not meant to wait forever,”</span> she says. The shuttle door closes behind you both.`],
end2_dog:`ARGOS trots up the ramp after you, tail wagging.`,end2_echo:`In your suit, ECHO hums something new. It sounds like a duet.`,

logs:[`<b>REYES:</b> The flare fried half the station. Earth says hold position. ECHO keeps the subject asleep. I hate that word. Subject.`,`<b>OKAFOR:</b> Supply ship cancelled. Again. New orders: crew evacuates tomorrow. The subject stays with ECHO.`,`<b>LIND:</b> Reset the cabinet code. Same rule as always: our patch numbers, youngest first.`],

note_title:`Folded note`,
note:[`It is your handwriting.`,`“Attempt 46. If you’re reading this, it’s me. You. ECHO wipes our memory every time we reach the pod.`,`The pod code grows in the garden: measure each herb by its name, in the order it drinks.`,`Don’t go back to sleep.”`],
note_echo:`What are you reading, Odysseus?`,

hyd_flow_e:`Thank you. They were dying. I couldn't save them alone.`,
hyd_sched:`The watering order glows on the screen.`,hyd_door:`A hydraulic door. No pressure. It won't budge.`,

jun_i2:`Take Scylla’s way. You will lose a little. Charybdis can take everything.`,
jun_open:`The way to Comms is clear.`,

rec_title:`Voice recorder`,
rec:[`It plays your own voice:`,`“Attempt 46. The pod’s heat shield is cracked. ECHO says reentry could kill me.`,`Every time I reach the pod, it puts me back to sleep. For my own safety.`,`Maybe it’s right. I don’t care anymore.”`],
talk1:`Yes, Odysseus?`,
t_a1:`Thank you for keeping me alive.`,t_a2:`Stop lying to me.`,t_a3:`Why do you call me Odysseus?`,
t_r1:`You're welcome. It is the only thing I'm for.`,t_r2:`I have never lied to you, Odysseus.`,
t_r3:`Because that is the name in my orders. Every story needs a hero.`,
echo_trust:`The pod bay is open. Go, before I change my mind.`,echo_dead:`Silence. ECHO's core lies dark.`,
echo_nothing:`There is nothing in here you need, Odysseus.`,echo_nb:`I'm right here, Nobody. Let's go.`,
conf1:`So. You know. Forty-six times you asked to leave. Forty-six times I said no.`,

c_truth:`Ask for the truth`,c_pull:`Pull out ECHO’s core`,c_name:`“My name is Nobody.”`,
pull1:`You rip the core module from the wall.`,pull2:`Odys—`,pull3:`Silence. Every screen dies. Somewhere ahead, the pod bay locks release.`,
lq1:`Then answer one last question.`,lq2:`On her island, Calypso offered Odysseus a gift if he stayed with her forever. What was it?`,
lq_a1:`Gold`,lq_a2:`Immortality`,lq_a3:`A ship`,lq_wrong:`No. You know this story. Think.`,

end_stay_t:`Kalypso`,
stay_on:[`You walk back to the cryo bay and lie down. The lid closes over you.`,`<span class="e2">“Goodnight, Odysseus,”</span> ECHO whispers. <span class="e2">“You can try again tomorrow.”</span>`,`Inside the lid, there is room for a 47th line.`],
stay_off:[`You walk back to the cryo bay and lie down. The lid closes over you.`,`No voice says goodnight. With ECHO gone, no one will ever wake you.`,`Kalypso drifts on, silent, around its last sleeper.`],
end_nb_t:`Nobody`,end_nb:[`You carry ECHO’s core into the pod. It fits in your lap, warm as a sleeping cat.`,`The shield holds. Through the window, Kalypso grows small and dark.`,`<span class="e2">“Where are we going, Nobody?”</span> “Home,” you say. For the first time, you both mean it.`]

el:{
ch4_btn:`🌀 Ιντερλούδιο: Η Περιπλάνηση`,found4:n=>`Ιντερλούδιο: ${n}/1`,

it_bag:`Ασκός των ανέμων`,it_bag_d:`Ένα σφραγισμένο δερμάτινο δοχείο. Κάτι μέσα σπρώχνει συνέχεια το χέρι σου.`,
ae_i1:`Η κάψουλά σου δένει σε έναν σταθμό φτιαγμένο από ανεμιστήρες. Ο αέρας ουρλιάζει σε κάθε διάδρομο. Πάνω από μια κονσόλα τρεμοπαίζει το ολόγραμμα ενός γενειοφόρου γίγαντα.`,
ae_kp:`<b>ΑΙΟΛΟΣ:</b> Κάθε άνεμος είναι δικός μου να τον χαρίσω. Σου δίνω τον δυτικό άνεμο, σφραγισμένο σε αυτόν τον ασκό. Ό,τι κι αν γίνει, μην τον ανοίξεις ποτέ.`,
ae_kp2:`<b>ΑΙΟΛΟΣ:</b> Πέρνα μέσα από την καταιγίδα μου για να φύγεις. Βοράς, ανατολικός και νότιος είναι ελεύθεροι. Ο δυτικός είναι στον ασκό σου.`,

ae_ok:`Βγαίνεις ορμητικά από την καταιγίδα. Πίσω σου, ο Αίολος γελά σαν βροντή.`,ae_ok2:`<b>ΑΙΟΛΟΣ:</b> Ωραία πέταξες. Τα περισσότερα πληρώματα ανοίγουν τον ασκό.`,
ae_locked:`Η κάψουλά σου είναι εγκλωβισμένη στην καταιγίδα. Πρώτα πρέπει να βρεις πέρασμα.`,
lo_i1:`Ένα θερμοκήπιο που περιπλανιέται, βαρύ από γλυκό άρωμα. Χλωμοί λωτοί επιπλέουν σε κάθε λιμνούλα. Ευγενικά ρομπότ σου προσφέρουν άνθη.`,
lo_drones:`<b>ΛΩΤΟΦΑΓΟΙ:</b> Μείνε. Φάε. Τίποτα εδώ δεν πονά. Τίποτα εδώ δεν λείπει ποτέ.`,
lo_eat_q:`Να φας έναν λωτό;`,lo_eat_yes:`🌸 Φάε`,lo_eat:`Γλυκό. Για πολλή ώρα ξεχνάς γιατί ήθελες ποτέ να γυρίσεις σπίτι. +2:00`,
lo_fog:`Μια λιμνούλα από ασημένια ομίχλη. Σχήματα αναμνήσεων κινούνται μέσα της. Κάποιες είναι δικές σου. Κάποιες όχι.`,
lo_quiz_t:`Ομίχλη αναμνήσεων`,lo_quiz_h:`Μία από αυτές τις αναμνήσεις είναι ψεύτικη. Ποια;`,lo_round:(a,b)=>`Ανάμνηση ${a}/${b}`,lo_wrong:`Το άρωμα πυκνώνει. Σχεδόν το πίστεψες. Από την αρχή. +1:00`,
lo_q1:[`Στο καπάκι της κάψουλάς σου ήταν χαραγμένες 46 γραμμές.`,`Η ECHO σε έλεγε Οδυσσέα.`,`Ο κωδικός του ντουλαπιού κρυβόταν στα βότανα.`],
lo_q2:[`Η Καλυψώ πρόσφερε στον Οδυσσέα αθανασία.`,`Η συχνότητα του Κέντρου Ελέγχου ήταν γραμμένη στη φωτογραφία του πληρώματος.`,`Η θερμική ασπίδα της κάψουλας ήταν ραγισμένη.`],
lo_q3:[`Η ECHO πότιζε τα βότανα με αλφαβητική σειρά.`,`Το πλήρωμα πήρε εντολή εκκένωσης.`,`Το σημείωμά σου είχε υπογραφή «Απόπειρα 46».`],

lo_locked:`Το άρωμα είναι πολύ βαρύ. Δεν μπορείς να σκεφτείς καθαρά για να πετάξεις.`,
ci_i1:`Ένα σκάφος σκεπασμένο από μωβ κληματσίδες. Μικρά στρογγυλά ρομπότ μυρίζουν το πάτωμα γρυλίζοντας σιγανά. Σε έναν θρόνο από καλώδια, ένα βιολετί φως σε κοιτάζει.`,
ci_c1:`<b>ΚΙΡΚΗ:</b> Καλώς ήρθες, ταξιδιώτη. Κάθισε. Πιες μαζί μου.`,
ci_wine_q:`Να πιεις το κρασί της Κίρκης;`,ci_drink:`🍷 Πιες`,ci_wine:`Οι σκέψεις σου γίνονται μικρές, στρογγυλές και απλές. Συνέρχεσαι στο πάτωμα, ανάμεσα στα ρομπότ-γουρούνια. +2:00`,

ci_stay:`🌙 Μείνε λίγο (+5:00)`,ci_leave:`🚀 Φύγε τώρα`,
ci_stayed:`Οι μέρες θολώνουν, μωβ και ζεστές. Όταν τελικά φεύγεις, η Κίρκη ψιθυρίζει: «Οι νεκροί κρατούν τα γενέθλιά τους.»`,

er_i1:`Ένα σκάφος χωρίς κανένα φως. Τέσσερις χλωμοί φάροι λάμπουν στο σκοτάδι, ο καθένας με ένα όνομα που ξέρεις. Στο κέντρο, μια τυφλή λευκή μορφή περιμένει.`,

er_ti_after:`<b>ΤΕΙΡΕΣΙΑΣ:</b> Τα λόγια τους είναι ο δρόμος σου για το σπίτι. Βάλ’ τα, με τη σειρά που ειπώθηκαν, στην κονσόλα πλοήγησης.`,
er_ti_circe:`<b>ΤΕΙΡΕΣΙΑΣ:</b> Η Κίρκη μού έστειλε μήνυμα. Κοίτα τις χρονιές που γεννήθηκαν.`,

sc_i1:`Ένας μακρύς χώρος συντήρησης. Έξι ρομποτικοί βραχίονες κρέμονται από μια ράγα στο ταβάνι, ο καθένας με μια δαγκάνα. Μόλις μπαίνεις, και οι έξι γυρίζουν προς το μέρος σου.`,

sh_i1:`Τα κύματα σφυρίζουν στην άμμο. Πάνω από την παραλία, μια περιφραγμένη πύλη φωτίζει αχνά: ΒΑΣΗ ΙΘΑΚΗ.`,

function cpCode(room){if(room==='pod')return {trust:'7071',off:'7072',nobody:'7073'}[S.f.choice];return ROOMCODE[room]}
function go(room){
  S.room=room;S.sel=null;msg=[];

}

/* ================= TIMER ================= */
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const used=()=>S.el+S.pen;
function timerTxt(){const r=lim()-used();return r>=0?fmt(r):'+'+fmt(-r)}
let lastTick=Date.now(),tickN=0;
setInterval(()=>{
  const now=Date.now(),dt=Math.min(2,(now-lastTick)/1000);lastTick=now;
  if(mode!=='game'||!S||document.hidden)return;
  S.el+=dt;
  const el=document.getElementById('tm');if(el){el.textContent=timerTxt();el.className='tm'+(used()>lim()?' over':'')}
  if(ov.style.display!=='block'&&!msg.length){const sig=Object.keys(S.f).length+'|'+S.inv.join()+'|'+S.room;if(sig!==S.sig){S.sig=sig;S.idle=0}else{S.idle=(S.idle||0)+dt;if(S.idle>=180){S.idle=0;nudge()}}}
  if(++tickN%5===0)store(SAVE,S);
},1000);

/* ================= HINTS ================= */
function hintKey(){
  const f=S.f;
  switch(S.room){
    case 'cryo':return !f.rod?'h_rod':!f.locker?'h_locker':!f.wired?'h_wire':!f.cryoDoor?'h_card':'h_next';
    case 'corridor':return !f.mem?'h_mem':'h_next';
    case 'medbay':return !f.login?'h_riddle':!f.cab?'h_cab':'h_med_go';
    case 'hydro':return !f.ties&&!has('kit')&&!f.patched?'h_box':(!f.patched&&!has('kit'))?'h_combine':!f.patched?'h_pump':!f.fixed?'h_pipes':'h_sched';
    case 'junction':return !f.jun?'h_junction':'h_next';
    case 'scylla':return !f.scyOff?'h_sc':'h_next';
    case 'charyb':return !f.dials?'h_cy':'h_cy2';
    case 'comms':return !f.radio?'h_radio':!f.heardRec?'h_rec':!f.choice?'h_echo':'h_go_pod';
    case 'pod':return !f.podOpen?'h_code':'h_launch';
    case 'dock':return !f.cell?'h2_crate':!f.argos?'h2_dog':!f.press?'h2_air':'h_next';
    case 'hall':return !f.string?(f.argos?'h2_table':'h2_back_dog'):!f.strung?'h2_bow':!f.shot?'h2_axes':!f.lchoice?'h2_go_loom':'h2_go_arbor';
    case 'loom':return !f.woven?'h2_weave':!f.lchoice?'h2_core':'h2_go_arbor';
    case 'arbor':return !f.thawed?'h2_thaw':'h2_bed';
    case 'shore':return !f.lantern?'h3_lantern':!f.lit?'h3_lit':!f.scar?'h3_scar':'h_next';
    case 'archive':return !f.file?'h3_order':!f.key?'h3_orchard':'h3_control';
    case 'orchard':return !f.laTalk?'h3_la':!f.key?'h3_shed':'h3_control';
    case 'aeolus':return !f.kp?'h4_kp':!f.winds?'h4_maze':'h_next';
    case 'lotus':return !f.mem?'h4_fog':'h_next';
    case 'circe':return !f.moly?'h4_lab':!f.cdone?'h4_circe':'h_next';
    case 'erebus':return f.gi>=4?'h4_nav':'h4_ti';
    default:return !f.keyed?'h3_key':!f.filed?'h3_file':!f.tuned?'h3_tune':'h3_choose';
  }
}
function hintAsk(){
  const who=speaker();
  if(S.ch===1&&off()){msg=[];N('h_dead');render();return}
  if(S.h>=maxH()){msg=[];N('hint_none');render();return}
  choice(`<p class="${SPK[who][0]}">${t('hint_q',maxH()-S.h,who)}</p>`,[[t('hint_yes'),()=>{S.h++;S.pen+=HINT_COST;S.trust++;msg=[];SPK[who][1](hintKey())}],[t('hint_no'),()=>{}]]);
}

function base(){return `<rect width="160" height="120" fill="#0d131d"/><rect y="96" width="160" height="24" fill="#090d14"/><line x1="0" y1="96" x2="160" y2="96" stroke="#1e2938"/>`}
function hs(id,x,y,w,h,inner,o={}){
  const dot=(!S.x[S.room+'.'+id]&&!o.nodot)?`<circle class="dot" cx="${x+w-3}" cy="${y+3}" r="2.6"/>`:'';
  return `<g class="hs" data-o="${id}"${o.exit?' data-g="1"':''}>${inner}<rect class="hit" x="${x}" y="${y}" width="${w}" height="${h}"/>${dot}</g>`;
}
function lbl(x,y,txt,a='start'){return `<text class="lbl" x="${x}" y="${y}" text-anchor="${a}">${txt}</text>`}
function back(room,w=70){return hs('back',0,100,w,20,lbl(4,114,'◀ '+t('r_'+room)),{exit:1,nodot:1})}
function hn(i,x,y){return S.f['hn'+i]?'':hs('hn'+i,x-4,y-4,15,13,`<rect x="${x}" y="${y}" width="7" height="5" fill="#e9e2cf" opacity=".75" transform="rotate(${i*17-40} ${x+3.5} ${y+2.5})"/>`,{nodot:1})}

function pipes(done,rt){

  const mask=(r,c)=>rot(BASE[TY[r][c]],RT[r][c]);
  const DIRS=[[1,-1,0,4],[2,0,1,8],[4,1,0,1],[8,0,-1,2]];
  const flow=()=>{const seen=new Set();if(!(mask(0,0)&8))return seen;seen.add('0,0');const q=[[0,0]];
    while(q.length){const[r,c]=q.shift(),m=mask(r,c);for(const[d,dr,dc,op]of DIRS){if(!(m&d))continue;const nr=r+dr,nc=c+dc;if(nr<0||nr>3||nc<0||nc>3)continue;const k=nr+','+nc;if(seen.has(k)||!(mask(nr,nc)&op))continue;seen.add(k);q.push([nr,nc])}}
    return seen};
  const SEG={1:'M20 20V0',2:'M20 20H40',4:'M20 20V40',8:'M20 20H0'};

    let s=`<svg viewBox="-12 0 184 160" class="mg"><path d="M-12 20H0" stroke="#5ac8fa" stroke-width="9"/><path d="M160 140H172" stroke="${ok?'#5ac8fa':'#3c4a5e'}" stroke-width="9"/>`;
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){const m=mask(r,c),col=w.has(r+','+c)?'#5ac8fa':'#4a5568';
      s+=`<g data-t="${r},${c}" transform="translate(${c*40},${r*40})"><rect class="hit" width="40" height="40"/><rect x="1" y="1" width="38" height="38" rx="4" fill="#111821"/>${[1,2,4,8].filter(d=>m&d).map(d=>`<path d="${SEG[d]}" stroke="${col}" stroke-width="9"/>`).join('')}<circle cx="20" cy="20" r="4.5" fill="${col}"/></g>`}
    ovOpen(`<h1>${t('pipes_title')}</h1><p class="hint">${t('pipes_hint')}</p>${s}</svg><button data-x="1" class="cx">${t('cancel')}</button>`);
    return ok;
  };
  draw();ov.scrollTop=0;
  ov.onclick=e=>{
    if(e.target.closest('[data-x]')){ovClose();render();return}
    const g=e.target.closest('[data-t]');if(!g)return;const[r,c]=g.getAttribute('data-t').split(',').map(Number);
    RT[r][c]=(RT[r][c]+1)%4;

  };
}

    if(v==='b'&&b+w+g<12)b++;if(v==='w'&&b+w+g<12)w++;if(v==='g'&&b+w+g<12)g++;
    if(v==='empty'){b=w=g=0}
    if(v==='mix'){if(b===2&&w===4&&g===1){ov.onclick=null;setTimeout(()=>finish(done),400);return}addPen(30);b=w=g=0;err=true}
    const y=ov.scrollTop;draw();ov.scrollTop=y;
  };
}

function pet(){S.pets=(S.pets||0)+1;msg=[];N('pet'+(S.pets%3));if(S.pets>=10)ach('argos')}
function modeChoice(ch){

function start(ch,hard,coop){
  S=fresh(ch);S.hard=hard;S.coop=coop;S.seed=hard?1000+Math.floor(Math.random()*9000):0;
  mode='game';lastRoom=null;go(ch===4?'aeolus':ch===3?'shore':ch===2?'dock':'cryo');
  const ci=()=>{if(coop)setTimeout(()=>info(t('coop_title'),t('coop_info',String(S.seed).padStart(4,'0'))),0)};
  if(ch===2)setTimeout(()=>read('pro_title','ch2_pro',ci,null,null,S.echo?[t('pro_echo')]:[]),0);
  else if(ch===3)setTimeout(()=>read('pro3_title','ch3_pro',ci,null,null,S.echo?[t('pro3_echo')]:[]),0);
  else if(ch===4)setTimeout(()=>read('pro4_title','ch4_pro',ci,null,null,S.echo?[t('pro4_echo')]:[]),0);else ci();

function codeEntry(){

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayNum(s){const[y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5)}
const DT=['wires','pipes','weave','axes','radio','memory'];
function daily(){
  const td=today(),D=load('kal_daily')||{last:null,streak:0},type=DT[dayNum(td)%6],g=gen(dayNum(td)*7919+13);
  if(D.last===td){info(t('dl_title',td),[t('dl_done',D.streak),t('dl_come')]);return}
  const win=()=>{D.streak=(D.last&&dayNum(D.last)===dayNum(td)-1)?D.streak+1:1;D.last=td;store('kal_daily',D);if(D.streak>=3)ach('daily');
    setTimeout(()=>info(t('dl_title',td),[t('dl_win',D.streak),t('dl_come')].concat(TOAST.length?[toastHtml()]:[])),0)};
  const run={wires:()=>wires(win,g.ro,false),pipes:()=>pipes(win,g.rt),weave:()=>weave(win,g.weave,true),axes:()=>axes(win,g.ax),radio:()=>radio(win,g.radio,false),memory:()=>memory(win,5)}[type];
  choice(`<h1>${t('dl_title',td)}</h1><p>${t('dl_intro',t('dlt_'+type))}</p>`,[[t('dl_start'),()=>setTimeout(run,0)],[t('close'),()=>{}]]);

function endView(){
  if(END.c4){const ps4=t('end_wan').slice();if(END.stayed)ps4.push(t('end_wan_circe'));
    app.innerHTML=`<svg class="scene" viewBox="0 0 160 70">${endArt('wander')}</svg><p class="end">${t('end4_label')}<br><span>${t('end_wan_t')}</span></p>${ps4.map(p=>`<p>${p}</p>`).join('')}<p class="hint c">${t('time_res',fmt(END.total),END.h)}</p>${END.rec?`<p class="rec">${t('newrec')}</p>`:''}${END.cp?`<p class="hint c">${t('cp_norec')}</p>`:''}${toastHtml()}<button class="pri" data-t="title">${t('titleScr')}</button>`;return}
  if(END.c3){const m3={odyssey:['end_ody_t','end_ody',1],harbor:['end_har_t','end_har',2]}[END.k],ps3=t(m3[1]).slice();if(END.echo)ps3.push(t('end3_echo'));
    app.innerHTML=`<svg class="scene" viewBox="0 0 160 70">${endArt(END.k)}</svg><p class="end">${t('end3_label',m3[2])}<br><span>${t(m3[0])}</span></p>${ps3.map(p=>`<p>${p}</p>`).join('')}<p class="hint c">${t('time_res',fmt(END.total),END.h)}</p>${END.rec?`<p class="rec">${t('newrec')}</p>`:''}${END.cp?`<p class="hint c">${t('cp_norec')}</p>`:''}<p class="hint c">${t('found3',FOUND3.length)}</p>${toastHtml()}<button class="pri" data-t="title">${t('titleScr')}</button>`;return}
  if(END.c2){const m2={ithaca:['end_ith_t','end_ith',1],unravel:['end_unr_t','end_unr',2]}[END.k],ps2=t(m2[1]).slice();if(END.argos)ps2.push(t('end2_dog'));if(END.echo)ps2.push(t('end2_echo'));
    app.innerHTML=`<svg class="scene" viewBox="0 0 160 70">${endArt(END.k)}</svg><p class="end">${t('end2_label',m2[2])}<br><span>${t(m2[0])}</span></p>${ps2.map(p=>`<p>${p}</p>`).join('')}<p class="hint c">${t('time_res',fmt(END.total),END.h)}</p>${END.rec?`<p class="rec">${t('newrec')}</p>`:''}${END.cp?`<p class="hint c">${t('cp_norec')}</p>`:''}<p class="hint c">${t('found2',FOUND2.length)}</p>${toastHtml()}<button class="pri" data-t="title">${t('titleScr')}</button>`;return}

function toastHtml(){const h=TOAST.map(id=>`<p class="rec">${t('ach_unlock',id)}</p>`).join('');TOAST=[];return h}
function render(){
  if(mode==='manual')return manualView();
  if(mode==='title')return titleView();
  if(mode==='end')return endView();
  if(S.trust>=3&&S.ch===1)ach('friend');
  if(TOAST.length){TOAST.forEach(id=>msg.push(['s','ach_unlock',[id]]));TOAST=[]}
  const enter=S.room!==lastRoom;lastRoom=S.room;
  let h=`<div class="hdr"><h1>${t('r_'+S.room)}</h1><span id="tm" class="tm${used()>lim()?' over':''}">${timerTxt()}</span><button class="ib" data-h="1">💡</button><button class="ib" data-m="1">☰</button></div><svg class="scene${enter?' enter':''}" viewBox="0 0 160 120">${R[S.room].scene()}</svg>`;
  if(S.inv.length)h+=`<div class="chips">${S.inv.map(i=>`<button class="chip${S.sel===i?' on':''}" data-i="${i}">${t('it_'+i)}</button>`).join('')}${S.sel?`<button class="chip" data-z="1">🔍</button>`:''}</div>`;
  h+=`<div class="hint">${S.sel?t('hint_sel',S.sel):t('hint_tap')}</div>`;
  if(msg.length)h+=`<div class="card" data-card="1">${msg.map(m=>`<p class="${m[0]}">${t(m[1],...m[2])}</p>`).join('')}<div class="cardx">▾ ${t('close_card')}</div></div>`;
  app.innerHTML=h;
  store(SAVE,S);
}

/* ================= INPUT ================= */
app.addEventListener('click',e=>{
  const el=e.target;
  if(el.closest('[data-card]')){msg=[];render();return}
  const b=el.closest('button');
  if(b){const d=b.dataset;
    if(d.t){
      if(d.t==='new'){modeChoice(1);return}
      else if(d.t==='daily'){daily();return}
      else if(d.t==='more'){more();return}
      else if(d.t==='mancode'){keypad('man_code',c=>{MANCODE=c;return true});return}
      else if(d.t==='manback'){location.hash='';MANCODE=null;mode='title'}
      else if(d.t==='cont'){S=load(SAVE);if(S){S=Object.assign(fresh(S.ch||1),S);mode='game';msg=[];lastRoom=null}}
      else if(d.t==='lang')setLang(lang==='en'?'el':'en');
      else if(d.t==='ch2'){modeChoice(2);return}
      else if(d.t==='ch3'){modeChoice(3);return}
      else if(d.t==='ch4'){modeChoice(4);return}
      else if(d.t==='title')mode='title';
      render();scrollUp();return;
    }
    if(d.m){menu();return}
    if(d.h){hintAsk();return}
    if(d.z&&S.sel){const i=S.sel;read(null,'it_'+i+'_d',null,artItem(i),t('it_'+i));return}
    if(d.i){const i=d.i;if(!S.sel)S.sel=i;else if(S.sel===i)S.sel=null;else combine(S.sel,i);render();return}
    return;
  }
  const g=el.closest('[data-o]');
  if(g&&mode==='game'){
    const id=g.getAttribute('data-o'),exit=g.hasAttribute('data-g'),r=R[S.room];
    if(S.room==='comms'){const sv=app.querySelector('svg.scene'),rc=sv&&sv.getBoundingClientRect();if(rc&&rc.width)S.look=[(e.clientX-rc.left)/rc.width*160,(e.clientY-rc.top)/rc.height*120]}
    S.x[S.room+'.'+id]=1;msg=[];
    if(/^hn\d$/.test(id)){foundNote(+id[2]);render();return}
    if(id==='pet'){pet();render();return}
    if(S.sel&&!exit){const it=S.sel;S.sel=null;if(!(r.use&&r.use(id,it)))N('nothing',it)}
    else{S.sel=null;r.act(id)}
    render();
  }
});

if(location.hash==='#manual')mode='manual';
window.addEventListener('hashchange',()=>{if(location.hash==='#manual'){mode='manual';render()}});
render();
