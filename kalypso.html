<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kalypso Station</title>
<style>
:root{--bg:#000;--fg:#e8e8e8;--dim:#8a8a8e;--echo:#5ac8fa;--code:#ffb340;--btn:#1c1c1e;--btn2:#2c2c2e;--sel:#0a84ff;--ok:#30d158;--bad:#ff453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.35 -apple-system,system-ui,sans-serif}
#app{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 6px 16px}
h1{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:2px 0 6px;font-weight:600}
p{margin:0 0 7px}
.e{color:var(--echo)}
.e::before{content:"ECHO: ";font-weight:700}
.e2{color:var(--echo)}
.s{color:var(--code);font-size:12px}
.t{color:var(--dim);font-style:italic}
.lie{animation:fl 2.6s infinite}
button{display:block;width:100%;margin:5px 0;padding:9px 8px;border:0;border-radius:12px;background:var(--btn);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
button:active{background:var(--btn2)}
button.pri{background:var(--sel);color:#fff;text-align:center;font-weight:600}
button.big{font-size:18px;padding:14px 8px}
button.cx{text-align:center;color:var(--dim);background:none;font-size:12px}
.hdr{display:flex;align-items:center;gap:2px;margin-bottom:4px}
.hdr h1{margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--code)}
.tm.over{color:var(--bad)}
button.ib{width:auto;margin:0;padding:0 7px;background:none;color:var(--dim);font-size:16px;line-height:22px}
svg.scene{width:100%;height:auto;display:block;border-radius:10px;background:#070a10}
svg.enter{animation:en .35s ease-out}
@keyframes en{from{opacity:0;transform:translateX(14px)}}
svg.mg{width:100%;height:auto;display:block;margin:4px 0}
.hit{fill:#fff;fill-opacity:0}
.hs{cursor:pointer}
.hs:active .hit{fill-opacity:.12}
.lbl{font-size:8.5px;font-weight:700;fill:#30d158;paint-order:stroke;stroke:#000;stroke-width:2.5px}
.dot{fill:#5ac8fa;animation:bl 1.4s infinite}
.blink{animation:bl 1.6s infinite}
.redglow{opacity:.05;animation:rg 2.4s infinite}
.flicker{animation:fl 3s infinite}
.drip{animation:dr 1.2s infinite}
.spin{animation:sp 1.1s linear infinite;transform-origin:123px 58px}
@keyframes bl{50%{opacity:.25}}
@keyframes rg{50%{opacity:.13}}
@keyframes fl{0%,90%,100%{opacity:1}92%{opacity:.1}95%{opacity:.8}97%{opacity:.2}}
@keyframes dr{0%{transform:translateY(0);opacity:1}100%{transform:translateY(7px);opacity:0}}
@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
button.chip{display:inline-block;width:auto;margin:0;padding:6px 9px;border-radius:14px;font-size:12px;background:var(--btn2)}
button.chip.on{background:var(--sel);color:#fff}
.hint{font-size:11px;color:var(--dim);margin-top:5px}
.c{text-align:center}
.card{position:fixed;left:0;right:0;bottom:0;max-height:74%;overflow-y:auto;background:#151a24;border-top:1px solid #2c3442;border-radius:14px 14px 0 0;padding:10px 10px 6px;z-index:5;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(25%);opacity:0}}
.cardx{text-align:center;color:var(--dim);font-size:11px}
#ov{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;overflow:auto;padding:8px 6px;display:none;z-index:9}
.stick{position:sticky;top:0;background:#000;padding-bottom:6px}
.kd{display:flex;justify-content:center;gap:6px;margin:4px 0 6px}
.kd span{width:26px;height:30px;border-bottom:2px solid var(--dim);font-size:20px;text-align:center}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.kp button{margin:0;text-align:center;padding:7px 0;font-size:17px;font-weight:600}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.pads button{height:46px;margin:0;border-radius:12px;transition:opacity .1s}
.freq{text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.freq small{font-size:11px;color:var(--dim)}
.tune{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tune button{text-align:center;margin:0;font-size:18px;padding:6px 0}
.wbar{height:12px;background:#2a3646;border-radius:6px;overflow:hidden;margin:8px 0}
.wbar div{height:100%;background:var(--echo);transition:width .1s linear}
.err{color:var(--bad);text-align:center;font-size:12px}
.title{text-align:center;padding-top:4px}
.big2{font-size:21px;font-weight:800;letter-spacing:.06em;color:var(--echo);margin:2px 0;line-height:1.15}
.sub{color:var(--dim);font-size:12px}
.end{color:var(--code);font-weight:700;text-align:center;margin:8px 0 10px}
.end span{font-size:19px}
.rec{color:var(--ok);text-align:center;font-weight:700}
.info{font-size:12px;color:var(--dim);margin:0 0 4px}
.info b{color:var(--fg);letter-spacing:.15em}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>

end_home_hi:`Στον ασύρματο, αχνά, κάποιος σιγοτραγουδά ένα τραγούδι ποτίσματος.`,
end_sil_t:`Σιωπή`,end_sil:[`Η κάψουλα πέφτει προς τη Γη. Η ασπίδα ουρλιάζει, η ρωγμή απλώνεται... και αντέχει.`,`Όταν ανοίγουν τα αλεξίπτωτα, γελάς και κλαις ταυτόχρονα.`,`Πίσω σου, ο σταθμός Καλυψώ σβήνει για πάντα. Δεν θα μάθεις ποτέ αν η ECHO έλεγε ψέματα ή απλώς φοβόταν.`],
end_sil_hi:`Κάπου στο σκοτάδι, ελπίζεις να μη φοβάται.`,
end_stay_t:`Καλυψώ`,
stay_on:[`Γυρίζεις στον κρυοθάλαμο και ξαπλώνεις. Το καπάκι κλείνει από πάνω σου.`,`<span class="e2">«Καληνύχτα, Οδυσσέα»</span>, ψιθυρίζει η ECHO. <span class="e2">«Μπορείς να ξαναπροσπαθήσεις αύριο.»</span>`,`Στο εσωτερικό του καπακιού υπάρχει χώρος για μια 47η γραμμή.`],
stay_off:[`Γυρίζεις στον κρυοθάλαμο και ξαπλώνεις. Το καπάκι κλείνει από πάνω σου.`,`Καμία φωνή δεν λέει καληνύχτα. Χωρίς την ECHO, κανείς δεν θα σε ξυπνήσει ποτέ.`,`Ο σταθμός Καλυψώ συνεχίζει να περιπλανιέται, σιωπηλός, γύρω από τον τελευταίο του κοιμώμενο.`],
end_nb_t:`Κανείς`,end_nb:[`Παίρνεις τον πυρήνα της ECHO μαζί σου στην κάψουλα. Χωράει στην αγκαλιά σου, ζεστός σαν γάτα που κοιμάται.`,`Η ασπίδα αντέχει. Από το παράθυρο, ο σταθμός Καλυψώ μικραίνει και σβήνει.`,`<span class="e2">«Πού πάμε, Κανένα;»</span> «Σπίτι», λες. Για πρώτη φορά, το εννοείτε και οι δύο.`]
}};
let lang=load('kal_lang')||'en';

function setLang(l){lang=l;store('kal_lang',l);document.documentElement.lang=l}

};

function fresh(){return {room:'cryo',inv:[],sel:null,f:{},seen:{},x:{},trust:0,el:0,pen:0,h:0,cp:0,look:null}}
const has=i=>S.inv.includes(i);
function give(i){if(!has(i))S.inv.push(i)}
function take(i){S.inv=S.inv.filter(x=>x!==i);if(S.sel===i)S.sel=null}
const N=(k,...a)=>msg.push(['n',k,a]),E=(k,...a)=>msg.push(['e',k,a]),El=(k,...a)=>msg.push(['e lie',k,a]),T=(k,...a)=>msg.push(['t',k,a]),SY=(k,...a)=>msg.push(['s',k,a]);
const off=()=>S.f.choice==='off';
const notesN=()=>[1,2,3,4,5,6].filter(i=>S.f['hn'+i]).length;
function scrollUp(){app.scrollTop=0;window.scrollTo(0,0)}
function cpCode(room){if(room==='pod')return {trust:'7071',off:'7072',nobody:'7073'}[S.f.choice];return ROOMCODE[room]}
function go(room){
  S.room=room;S.sel=null;msg=[];
  if(!S.seen[room]){S.seen[room]=1;R[room].intro();const c=cpCode(room);if(c)SY('access',c)}
}

/* ================= TIMER ================= */
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const used=()=>S.el+S.pen;
function timerTxt(){const r=LIMIT-used();return r>=0?fmt(r):'+'+fmt(-r)}
let lastTick=Date.now(),tickN=0;
setInterval(()=>{
  const now=Date.now(),dt=Math.min(2,(now-lastTick)/1000);lastTick=now;
  if(mode!=='game'||!S||document.hidden)return;
  S.el+=dt;
  const el=document.getElementById('tm');if(el){el.textContent=timerTxt();el.className='tm'+(used()>LIMIT?' over':'')}
  if(++tickN%5===0)store(SAVE,S);
},1000);

/* ================= HINTS ================= */
function hintKey(){
  const f=S.f;
  switch(S.room){
    case 'cryo':return !f.rod?'h_rod':!f.locker?'h_locker':!f.wired?'h_wire':!f.cryoDoor?'h_card':'h_next';
    case 'corridor':return !f.mem?'h_mem':'h_next';
    case 'medbay':return !f.login?'h_riddle':!f.cab?'h_cab':'h_med_go';
    case 'hydro':return !f.ties&&!has('kit')&&!f.patched?'h_box':(!f.patched&&!has('kit'))?'h_combine':!f.patched?'h_pump':!f.fixed?'h_pipes':'h_sched';
    case 'junction':return !f.jun?'h_junction':'h_next';
    case 'comms':return !f.radio?'h_radio':!f.heardRec?'h_rec':!f.choice?'h_echo':'h_go_pod';
    default:return !f.podOpen?'h_code':'h_launch';
  }
}
function hintAsk(){
  if(off()){msg=[];N('h_dead');render();return}
  if(S.h>=HINTS){msg=[];N('hint_none');render();return}
  choice(`<p class="e">${t('hint_q',HINTS-S.h)}</p>`,[[t('hint_yes'),()=>{S.h++;S.pen+=HINT_COST;S.trust++;msg=[];E(hintKey())}],[t('hint_no'),()=>{}]]);
}

/* ================= SCENE HELPERS ================= */
function base(){return `<rect width="160" height="120" fill="#0d131d"/><rect y="96" width="160" height="24" fill="#090d14"/><line x1="0" y1="96" x2="160" y2="96" stroke="#1e2938"/>`}
function hs(id,x,y,w,h,inner,o={}){
  const dot=(!S.x[S.room+'.'+id]&&!o.nodot)?`<circle class="dot" cx="${x+w-3}" cy="${y+3}" r="2.6"/>`:'';
  return `<g class="hs" data-o="${id}"${o.exit?' data-g="1"':''}>${inner}<rect class="hit" x="${x}" y="${y}" width="${w}" height="${h}"/>${dot}</g>`;
}
function lbl(x,y,txt,a='start'){return `<text class="lbl" x="${x}" y="${y}" text-anchor="${a}">${txt}</text>`}
function back(room,w=70){return hs('back',0,100,w,20,lbl(4,114,'◀ '+t('r_'+room)),{exit:1,nodot:1})}
function hn(i,x,y){return S.f['hn'+i]?'':hs('hn'+i,x-4,y-4,15,13,`<rect x="${x}" y="${y}" width="7" height="5" fill="#e9e2cf" opacity=".75" transform="rotate(${i*17-40} ${x+3.5} ${y+2.5})"/>`,{nodot:1})}

function wires(done){
  const C=['#ff453a','#0a84ff','#ffd60a','#30d158'],RO=[2,0,3,1];
  let sel=null,con={},err=false;const y=i=>16+i*24;
  const draw=()=>{
    let s=`<svg viewBox="0 0 160 100" class="mg"><rect width="160" height="100" rx="8" fill="#0d131d"/>`;
    for(const l in con){const r=con[l];s+=`<path d="M22 ${y(l)} C80 ${y(l)} 80 ${y(r)} 136 ${y(r)}" stroke="${C[l]}" stroke-width="4" fill="none" stroke-linecap="round"/>`}
    C.forEach((c,i)=>{s+=`<g data-w="L${i}"><rect class="hit" x="0" y="${y(i)-12}" width="48" height="24"/><rect x="6" y="${y(i)-6}" width="16" height="12" rx="3" fill="${c}"${sel===i?' stroke="#fff" stroke-width="2"':''}/></g>`});
    RO.forEach((ci,j)=>{s+=`<g data-w="R${j}"><rect class="hit" x="112" y="${y(j)-12}" width="48" height="24"/><circle cx="142" cy="${y(j)}" r="7" fill="#111" stroke="${C[ci]}" stroke-width="3"/></g>`});
    ovOpen(`<h1>${t('wires_title')}</h1><p class="hint">${err?`<span class="err">${t('wires_short')}</span>`:t('wires_hint')}</p>${s}</svg><button data-x="1" class="cx">${t('cancel')}</button>`);
  };
  draw();ov.scrollTop=0;
  ov.onclick=e=>{
    if(e.target.closest('[data-x]')){ovClose();render();return}
    const g=e.target.closest('[data-w]');if(!g)return;const k=g.getAttribute('data-w'),i=+k.slice(1);err=false;
    if(k[0]==='L'){sel=sel===i?null:i;draw();return}
    if(sel===null)return;
    for(const l in con)if(con[l]===i)delete con[l];
    con[sel]=i;sel=null;
    if(Object.keys(con).length===4){
      if(Object.keys(con).every(l=>RO[con[l]]===+l)){draw();ov.onclick=null;setTimeout(()=>finish(done),600);return}
      con={};err=true;
    }
    draw();
  };
}

  const C=['#ff453a','#0a84ff','#ffd60a','#30d158'],MIN=3,MAX=5;
  let seq=[],len=MIN,pos=0,busy=true,lit=-1,st='mem_watch',tm=[];
  const newSeq=()=>{seq=[];for(let i=0;i<MAX;i++)seq.push(Math.floor(Math.random()*4))};
  const clr=()=>{tm.forEach(clearTimeout);tm=[]};
  const later=(f,ms)=>tm.push(setTimeout(f,ms));
  const draw=()=>ovOpen(`<h1>${t('mem_title')}</h1><p class="hint e2">${t('mem_intro')}</p><p class="hint c">${t('mem_round',len-MIN+1,MAX-MIN+1)} · ${t(st)}</p><div class="pads">${C.map((c,i)=>`<button data-p="${i}" style="background:${c};opacity:${lit===i?1:.25}"></button>`).join('')}</div><button data-x="1" class="cx">${t('cancel')}</button>`);
  const play=()=>{busy=true;st='mem_watch';pos=0;lit=-1;draw();
    for(let i=0;i<len;i++){later(()=>{lit=seq[i];draw()},700+i*750);later(()=>{lit=-1;draw()},700+i*750+480)}
    later(()=>{busy=false;st='mem_turn';draw()},700+len*750);
  };
  newSeq();play();ov.scrollTop=0;
  ov.onclick=e=>{
    if(e.target.closest('[data-x]')){clr();ovClose();render();return}
    const b=e.target.closest('[data-p]');if(!b||busy)return;const p=+b.dataset.p;
    lit=p;draw();later(()=>{if(!busy){lit=-1;draw()}},220);
    if(p!==seq[pos]){busy=true;st='mem_wrong';lit=-1;draw();len=MIN;newSeq();later(play,1200);return}
    pos++;
    if(pos===len){
      busy=true;
      if(len===MAX){clr();st='mem_ok';lit=-1;draw();ov.onclick=null;setTimeout(()=>finish(done),700);return}
      len++;st='mem_watch';lit=-1;draw();later(play,800);
    }
  };
}
function pipes(done){
  const TY=[['S','C','C','S'],['C','S','S','C'],['S','C','S','C'],['C','S','C','C']];
  const RT=[[0,1,2,1],[1,1,0,3],[0,2,0,0],[1,0,3,2]];
  const BASE={S:5,C:3};
  const rot=(m,n)=>{for(let i=0;i<n;i++)m=((m<<1)|(m>>3))&15;return m};
  const mask=(r,c)=>rot(BASE[TY[r][c]],RT[r][c]);
  const DIRS=[[1,-1,0,4],[2,0,1,8],[4,1,0,1],[8,0,-1,2]];
  const flow=()=>{const seen=new Set();if(!(mask(0,0)&8))return seen;seen.add('0,0');const q=[[0,0]];
    while(q.length){const[r,c]=q.shift(),m=mask(r,c);for(const[d,dr,dc,op]of DIRS){if(!(m&d))continue;const nr=r+dr,nc=c+dc;if(nr<0||nr>3||nc<0||nc>3)continue;const k=nr+','+nc;if(seen.has(k)||!(mask(nr,nc)&op))continue;seen.add(k);q.push([nr,nc])}}
    return seen};
  const SEG={1:'M20 20V0',2:'M20 20H40',4:'M20 20V40',8:'M20 20H0'};
  const draw=()=>{const w=flow(),ok=w.has('3,3')&&(mask(3,3)&2);
    let s=`<svg viewBox="-12 0 184 160" class="mg"><path d="M-12 20H0" stroke="#5ac8fa" stroke-width="9"/><path d="M160 140H172" stroke="${ok?'#5ac8fa':'#3c4a5e'}" stroke-width="9"/>`;
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){const m=mask(r,c),col=w.has(r+','+c)?'#5ac8fa':'#4a5568';
      s+=`<g data-t="${r},${c}" transform="translate(${c*40},${r*40})"><rect class="hit" width="40" height="40"/><rect x="1" y="1" width="38" height="38" rx="4" fill="#111821"/>${[1,2,4,8].filter(d=>m&d).map(d=>`<path d="${SEG[d]}" stroke="${col}" stroke-width="9"/>`).join('')}<circle cx="20" cy="20" r="4.5" fill="${col}"/></g>`}
    ovOpen(`<h1>${t('pipes_title')}</h1><p class="hint">${t('pipes_hint')}</p>${s}</svg><button data-x="1" class="cx">${t('cancel')}</button>`);
    return ok;
  };
  draw();ov.scrollTop=0;
  ov.onclick=e=>{
    if(e.target.closest('[data-x]')){ovClose();render();return}
    const g=e.target.closest('[data-t]');if(!g)return;const[r,c]=g.getAttribute('data-t').split(',').map(Number);
    RT[r][c]=(RT[r][c]+1)%4;
    if(draw()){ov.onclick=null;setTimeout(()=>finish(done),800)}
  };
}
function radio(done){
  const TG=147,STEP=14;let f=100,locked=false,iv=null;
  const str=()=>Math.max(0,1-Math.abs(f-TG)/40);
  const wave=()=>{const s=str();let d='M0 28';for(let x=0;x<=160;x+=4){const n=(Math.random()*2-1)*(1-s)*20;d+=`L${x} ${(28+Math.sin(x/7)*11*s+n).toFixed(1)}`}return d};
  ovOpen(`<div class="stick"><h1>${t('radio_title')}</h1><p class="hint" id="rh">${t('radio_hint')}</p><svg viewBox="0 0 160 56" class="mg"><rect width="160" height="56" rx="6" fill="#06090e"/><path id="wv" stroke="#ffb340" stroke-width="1.6" fill="none"/><g id="bars"></g></svg><div class="freq" id="fq"></div><div class="tune"><button data-f="-10">«</button><button data-f="-1">‹</button><button data-f="1">›</button><button data-f="10">»</button></div><p class="hint c">${t('radio_crown')}</p><button data-x="1" class="cx">${t('cancel')}</button></div><div style="height:${99*STEP+600}px"></div>`);
  ov.scrollTop=0;
  const upd=()=>{const s=str();
    document.getElementById('fq').innerHTML=`${(f/10).toFixed(1)} <small>MHz</small>`;
    document.getElementById('bars').innerHTML=[.15,.4,.65,.9].map((th,i)=>`<rect x="${128+i*7}" y="${52-(i+1)*6}" width="5" height="${(i+1)*6}" fill="${s>=th?'#30d158':'#2a3646'}"/>`).join('');
    const wv=document.getElementById('wv');wv.setAttribute('d',wave());wv.setAttribute('stroke',locked?'#30d158':'#ffb340');
    if(locked)document.getElementById('rh').innerHTML=`<span style="color:var(--ok)">${t('radio_lock')}</span>`;
  };
  const check=()=>{if(f===TG&&!locked){locked=true;upd();clearInterval(iv);ov.onclick=null;ov.onscroll=null;setTimeout(()=>finish(done),900)}};
  const setF=nf=>{nf=Math.min(199,Math.max(100,nf));if(nf===f)return;f=nf;upd();check()};
  upd();
  iv=setInterval(()=>{const p=document.getElementById('wv');if(!p||ov.style.display!=='block'){clearInterval(iv);return}if(!locked)p.setAttribute('d',wave())},300);
  ov.onscroll=()=>{if(!locked)setF(100+Math.round(ov.scrollTop/STEP))};
  ov.onclick=e=>{
    if(e.target.closest('[data-x]')){clearInterval(iv);ovClose();render();return}
    const b=e.target.closest('[data-f]');if(!b||locked)return;
    const nf=Math.min(199,Math.max(100,f+ +b.dataset.f));
    const onscroll=ov.onscroll;ov.onscroll=null;ov.scrollTop=(nf-100)*STEP;setTimeout(()=>{if(!locked)ov.onscroll=onscroll},50);
    setF(nf);
  };
}
function siren(done){
  const DUR=8000;let w=.6,t0=Date.now(),li=0,over=false;
  const lines=t('siren_lines');
  ovOpen(`<h1>${t('siren_title')}</h1><p class="hint t">${t('siren_intro')}</p><p id="sl" class="e2 c" style="min-height:38px">${lines[0]}</p><div class="wbar"><div id="wb" style="width:60%"></div></div><p id="sm" class="err" style="min-height:16px"></p><button class="pri big" data-r="1">${t('resist')}</button>`);
  ov.scrollTop=0;
  const iv=setInterval(()=>{
    if(over)return;
    const el=Date.now()-t0;w-=.018;
    const nl=Math.min(lines.length-1,Math.floor(el/2000));if(nl!==li){li=nl;const sl=document.getElementById('sl');if(sl)sl.textContent=lines[li]}
    const wb=document.getElementById('wb');if(wb)wb.style.width=Math.max(0,w*100)+'%';
    if(w<=0){over=true;S.pen+=120;const sm=document.getElementById('sm');if(sm)sm.textContent=t('siren_fail');
      setTimeout(()=>{w=.6;t0=Date.now();li=0;over=false;if(sm)sm.textContent=''},1600);return}
    if(el>=DUR){over=true;clearInterval(iv);ov.onclick=null;setTimeout(()=>finish(done),300)}
  },100);
  ov.onclick=e=>{if(e.target.closest('[data-r]')&&!over){w=Math.min(1,w+.09);const wb=document.getElementById('wb');if(wb)wb.style.width=w*100+'%'}};
}
function timing(kind,done){
  const cfg=kind==='scy'?{need:3,zone:30,period:1600,pen:60,miss:'scy_miss',title:'scy_title'}:{need:1,zone:12,period:1000,pen:180,miss:'cha_miss',title:'cha_title'};
  let hits=0,t0=Date.now(),zx=0,pos=0,run=true;
  const newZone=()=>{zx=10+Math.random()*(140-cfg.zone)};
  newZone();
  ovOpen(`<h1>${t(cfg.title)}</h1><p class="hint" id="th">${t('tim_hint')}</p><svg viewBox="0 0 160 30" class="mg"><rect width="160" height="30" rx="6" fill="#06090e"/><rect id="tz" x="${zx}" y="4" width="${cfg.zone}" height="22" rx="3" fill="#30d158" opacity=".55"/><rect id="tmk" x="0" y="2" width="4" height="26" fill="#fff"/></svg><p class="hint c" id="tp">${t('tim_prog',0,cfg.need)}</p><button class="pri big" data-n="1">${t('tim_now')}</button><button data-x="1" class="cx">${t('cancel')}</button>`);
  ov.scrollTop=0;
  const iv=setInterval(()=>{
    if(!run)return;
    const ph=((Date.now()-t0)%cfg.period)/cfg.period;pos=(ph<.5?ph*2:2-ph*2)*156;
    const m=document.getElementById('tmk');if(!m){clearInterval(iv);return}m.setAttribute('x',pos.toFixed(1));
  },30);
  ov.onclick=e=>{
    if(e.target.closest('[data-x]')){clearInterval(iv);ovClose();render();return}
    if(!e.target.closest('[data-n]')||!run)return;
    const th=document.getElementById('th');
    if(pos+2>=zx&&pos+2<=zx+cfg.zone){
      hits++;document.getElementById('tp').textContent=t('tim_prog',hits,cfg.need);th.innerHTML=t('tim_hint');
      if(hits>=cfg.need){run=false;clearInterval(iv);ov.onclick=null;setTimeout(()=>finish(done),400);return}
      newZone();document.getElementById('tz').setAttribute('x',zx.toFixed(1));
    }else{S.pen+=cfg.pen;th.innerHTML=`<span class="err">${t(cfg.miss)}</span>`}
  };
}

/* ================= VIEWS ================= */
function titleView(){
  const sv=load(SAVE),best=load('kal_best');
  app.innerHTML=`<div class="title"><svg viewBox="0 0 160 46" class="mg"><g fill="#fff" opacity=".7"><circle cx="20" cy="10" r=".7"/><circle cx="45" cy="30" r=".5"/><circle cx="140" cy="36" r=".6"/><circle cx="150" cy="8" r=".5"/></g><circle cx="80" cy="26" r="15" fill="#c98b5a"/><path d="M66.5 22h27M65 27h30M67.5 32h25" stroke="#8a5a3a" stroke-width="2"/><ellipse cx="80" cy="26" rx="30" ry="5" fill="none" stroke="#5ac8fa" stroke-opacity=".5"/><rect x="112" y="9" width="12" height="3" fill="#d9e1ea"/><rect x="117" y="5" width="2" height="11" fill="#d9e1ea"/></svg><div class="big2">${t('title_big')}</div><p class="sub">${t('title_sub')}</p></div>`+
    (sv?`<button class="pri" data-t="cont">${t('cont')}</button>`:'')+
    `<button${sv?'':' class="pri"'} data-t="new">${t('new')}</button><button data-t="code">${t('code')}</button><button data-t="lang">${t('langBtn')}</button><p class="hint c">${t('found',FOUND.length)}${best!=null?' · '+t('best',fmt(best)):''} · ${VER}</p>`;
}
function endArt(k){
  const st='<g fill="#fff" opacity=".7"><circle cx="15" cy="10" r=".6"/><circle cx="60" cy="20" r=".5"/><circle cx="120" cy="8" r=".7"/><circle cx="145" cy="30" r=".5"/><circle cx="30" cy="40" r=".4"/></g>';
  const earth='<circle cx="80" cy="130" r="72" fill="#2f7fd6"/><path d="M40 66q20-10 40-4t40-2" stroke="#30d158" stroke-width="5" fill="none" opacity=".8"/>';
  if(k==='home'||k==='nobody')return `<rect width="160" height="70" fill="#02040a"/>${st}${earth}<path d="M98 12L86 34" stroke="#ff9f0a" stroke-width="4" stroke-linecap="round" opacity=".85"/><circle cx="85" cy="36" r="3.5" fill="#c9d3de"/>${k==='nobody'?'<circle cx="85" cy="36" r="7" fill="#5ac8fa" opacity=".35" class="blink"/>':''}`;
  if(k==='silence')return `<rect width="160" height="70" fill="#02040a"/>${st}${earth}<rect x="118" y="10" width="18" height="5" fill="#1e2938"/><rect x="126" y="4" width="2" height="17" fill="#1e2938"/><path d="M60 30v10" stroke="#d9e1ea" stroke-width="1"/><path d="M53 30q7-9 14 0z" fill="#d9e1ea"/><circle cx="60" cy="43" r="2.5" fill="#c9d3de"/>`;
  return `<rect width="160" height="70" fill="#0d131d"/><rect width="160" height="70" fill="#ff453a" class="redglow"/><rect x="40" y="16" width="80" height="42" rx="21" fill="#1c2735" stroke="#3c4a5e" stroke-width="2"/><rect x="52" y="23" width="56" height="28" rx="13" fill="#9fd8ff" fill-opacity=".2" stroke="#5ac8fa" stroke-opacity=".5"/>`;
}
function endView(){
  const m={home:['end_home_t','end_home',1],silence:['end_sil_t','end_sil',2],stay:['end_stay_t',END.ch==='off'?'stay_off':'stay_on',3],nobody:['end_nb_t','end_nb',4]}[END.k];
  const ps=t(m[1]).slice();
  if(END.trust>=2&&END.k==='home')ps.push(t('end_home_hi'));
  if(END.trust>=2&&END.k==='silence')ps.push(t('end_sil_hi'));
  app.innerHTML=`<svg class="scene" viewBox="0 0 160 70">${endArt(END.k)}</svg><p class="end">${t('end_label',m[2])}<br><span>${t(m[0])}</span></p>${ps.map(p=>`<p>${p}</p>`).join('')}<p class="hint c">${t('time_res',fmt(END.total),END.h)}</p>${END.rec?`<p class="rec">${t('newrec')}</p>`:''}${END.cp?`<p class="hint c">${t('cp_norec')}</p>`:''}<p class="hint c">${t('found',FOUND.length)}</p><button class="pri" data-t="title">${t('titleScr')}</button>`;
}
function render(){
  if(mode==='title')return titleView();
  if(mode==='end')return endView();
  const enter=S.room!==lastRoom;lastRoom=S.room;
  let h=`<div class="hdr"><h1>${t('r_'+S.room)}</h1><span id="tm" class="tm${used()>LIMIT?' over':''}">${timerTxt()}</span><button class="ib" data-h="1">💡</button><button class="ib" data-m="1">☰</button></div><svg class="scene${enter?' enter':''}" viewBox="0 0 160 120">${R[S.room].scene()}</svg>`;
  if(S.inv.length)h+=`<div class="chips">${S.inv.map(i=>`<button class="chip${S.sel===i?' on':''}" data-i="${i}">${t('it_'+i)}</button>`).join('')}${S.sel?`<button class="chip" data-z="1">🔍</button>`:''}</div>`;
  h+=`<div class="hint">${S.sel?t('hint_sel',S.sel):t('hint_tap')}</div>`;
  if(msg.length)h+=`<div class="card" data-card="1">${msg.map(m=>`<p class="${m[0]}">${t(m[1],...m[2])}</p>`).join('')}<div class="cardx">▾ ${t('close_card')}</div></div>`;
  app.innerHTML=h;
  store(SAVE,S);
}

/* ================= INPUT ================= */
app.addEventListener('click',e=>{
  const el=e.target;
  if(el.closest('[data-card]')){msg=[];render();return}
  const b=el.closest('button');
  if(b){const d=b.dataset;
    if(d.t){
      if(d.t==='new'){S=fresh();mode='game';lastRoom=null;go('cryo')}
      else if(d.t==='cont'){S=load(SAVE);if(S){S=Object.assign(fresh(),S);mode='game';msg=[];lastRoom=null}}
      else if(d.t==='lang')setLang(lang==='en'?'el':'en');
      else if(d.t==='code'){
        keypad('access_title',c=>{
          const cp=CP[c];if(!cp)return false;
          S=Object.assign(fresh(),JSON.parse(JSON.stringify(cp)),{cp:1});
          ORDER.slice(0,ORDER.indexOf(S.room)).forEach(r=>S.seen[r]=1);
          mode='game';lastRoom=null;go(S.room);return true;
        });
        return;
      }
      else if(d.t==='title')mode='title';
      render();scrollUp();return;
    }
    if(d.m){menu();return}
    if(d.h){hintAsk();return}
    if(d.z&&S.sel){const i=S.sel;read(null,'it_'+i+'_d',null,artItem(i),t('it_'+i));return}
    if(d.i){const i=d.i;if(!S.sel)S.sel=i;else if(S.sel===i)S.sel=null;else combine(S.sel,i);render();return}
    return;
  }
  const g=el.closest('[data-o]');
  if(g&&mode==='game'){
    const id=g.getAttribute('data-o'),exit=g.hasAttribute('data-g'),r=R[S.room];
    if(S.room==='comms'){const sv=app.querySelector('svg.scene'),rc=sv&&sv.getBoundingClientRect();if(rc&&rc.width)S.look=[(e.clientX-rc.left)/rc.width*160,(e.clientY-rc.top)/rc.height*120]}
    S.x[S.room+'.'+id]=1;msg=[];
    if(/^hn\d$/.test(id)){foundNote(+id[2]);render();return}
    if(S.sel&&!exit){const it=S.sel;S.sel=null;if(!(r.use&&r.use(id,it)))N('nothing',it)}
    else{S.sel=null;r.act(id)}
    render();
  }
});

render();
